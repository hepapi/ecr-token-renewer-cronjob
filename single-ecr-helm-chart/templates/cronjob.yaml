{{- if not .Values.repositories }}
{{- fail "repositories must contain at least one entry" }}
{{- end }}
{{- range .Values.repositories }}
{{- if not .name }}
{{- fail "each repository needs name" }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ecrCronjob.name" . }}-job
  namespace: {{ include "namespace" . }}
  labels:
    {{- include "ecrCronjob.labels" . | nindent 4 }}
spec:
  timeZone: {{ .Values.timezone | quote }}
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "ecrCronjob.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccount.name }}-sa
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          volumes:
            - name: token
              emptyDir:
                medium: Memory
            - name: tmp
              emptyDir:
                medium: Memory
          initContainers:
            - name: get-token
              image: {{ .Values.awsCli.image }}
              imagePullPolicy: {{ .Values.awsCli.imagePullPolicy }}
              securityContext:
                {{- toYaml .Values.awsCli.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.awsCli.resources | nindent 16 }}
              env:
                - name: HOME
                  value: /tmp
                - name: REGION
                  value: {{ .Values.region | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ecrCronjob.secretName" . }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ecrCronjob.secretName" . }}
                      key: AWS_SECRET_ACCESS_KEY
              command:
                - /bin/sh
                - -ce
                - |
                  export AWS_PAGER=
                  echo "Current identity:"
                  aws sts get-caller-identity

                  echo "Getting the ECR token and saving it."
                  aws ecr get-login-password --region "$REGION" > /token/ecr-token
                  test -s /token/ecr-token
              volumeMounts:
                - name: token
                  mountPath: /token
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: create-secret
              image: {{ .Values.kubectl.image }}
              imagePullPolicy: {{ .Values.kubectl.imagePullPolicy }}
              securityContext:
                {{- toYaml .Values.kubectl.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.kubectl.resources | nindent 16 }}
              env:
                - name: HOME
                  value: /tmp
              command:
                - /bin/bash
                - -ce
                - |
                  test -s /token/ecr-token
                  TOKEN=$(cat /token/ecr-token)
                  {{ range $repo := .Values.repositories }}
                  kubectl create secret generic {{ include "ecrCronjob.repoSecretName" (dict "prefix" (include "ecrCronjob.name" $) "path" $repo.path) | quote }} \
                    --namespace {{ include "namespace" $ | quote }} \
                    --from-literal=username=AWS \
                    --from-literal=password="$TOKEN" \
                    --from-literal=enableOCI=true \
                    --from-literal={{ printf "name=%s" $repo.name | quote }} \
                    --from-literal=type=helm \
                    --from-literal={{ printf "url=%s" (ternary (printf "%s/%s" $.Values.ecrRegistry $repo.path) $.Values.ecrRegistry (ne $repo.path "")) | quote }} \
                    --dry-run=client -o yaml \
                  | kubectl label --local -f - \
                    argocd.argoproj.io/secret-type=repository \
                    {{ printf "helm.sh/chart=%s" (include "ecrCronjob.chart" $) | quote }} \
                    {{ printf "app.kubernetes.io/name=%s" (include "ecrCronjob.name" $) | quote }} \
                    {{ printf "app.kubernetes.io/instance=%s" $.Release.Name | quote }} \
                    {{ printf "app.kubernetes.io/managed-by=%s" $.Release.Service | quote }} \
                    -o yaml \
                  | kubectl apply -f -
                  {{ end }}
              volumeMounts:
                - name: token
                  mountPath: /token
                - name: tmp
                  mountPath: /tmp
