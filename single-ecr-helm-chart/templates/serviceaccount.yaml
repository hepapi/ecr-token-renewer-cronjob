---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}-sa
  namespace: {{ include "namespace" . }}
  labels:
    {{- include "ecrCronjob.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "namespace" . }}
  labels:
    {{- include "ecrCronjob.labels" . | nindent 4 }}
rules:
  # create cannot be limited by resourceNames.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range .Values.repositories }}
      - {{ include "ecrCronjob.repoSecretName" (dict "prefix" (include "ecrCronjob.name" $) "path" .path) }}
      {{- end }}
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "namespace" . }}
  labels:
    {{- include "ecrCronjob.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}-sa
    namespace: {{ include "namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccount.name }}
