# ECR tokens last 12 hours. Every 5 hours leaves one retry before expiry.
schedule: "0 */5 * * *"
timezone: Asia/Istanbul
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# Run the job if the controller missed the tick by less than an hour.
startingDeadlineSeconds: 3600
activeDeadlineSeconds: 600
backoffLimit: 2

# Empty uses the release namespace. A non-empty string overrides it.
namespaceOverride: ""

# Resource name prefix for the CronJob and the Argo CD token Secrets.
name: ecr-creds-sync

# Base64-encoded IAM user keys for the single account that owns the registry.
# Leave these empty in git. Set them from Argo CD.
aws_access_key_id_base64: ""
aws_secret_access_key_base64: ""

# Single ECR registry in one AWS account.
# get-login-password returns one registry token. Each repositories entry
# becomes its own Argo CD Helm OCI secret at <ecrRegistry>/<path>.
region: "eu-west-1"
ecrRegistry: "AAAAAAAAAA.dkr.ecr.eu-west-1.amazonaws.com"
repositories:
  - name: "ECR charts"
    path: charts
  - name: "ECR app"
    path: app

serviceAccount:
  name: ecr-creds-sync

# amazon/aws-cli tags are immutable. bitnami/kubectl no longer publishes
# version tags on Docker Hub, so that image is pinned by manifest digest.
awsCli:
  image: amazon/aws-cli:2.41.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

kubectl:
  image: bitnami/kubectl@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Requires the Prometheus Operator CRD and kube-state-metrics.
# Add the labels your Prometheus selects, then set enabled to true.
monitoring:
  prometheusRule:
    enabled: false
    # Alert when the last successful refresh is older than this.
    # Schedule is 8 hours and the token lasts 12, so 10 hours catches a missed run.
    staleAfterSeconds: 36000
    labels: {}
